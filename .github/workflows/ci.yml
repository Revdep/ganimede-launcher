name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }
jobs:
  # the core tests alone (plain javac, no emulator): a logic error is red here minutes before the build job gets to its own coreTest
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: ./gradlew coreTest
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Syntax of the e2e scripts
        run: for f in e2e/*.sh e2e/sections/*.sh; do bash -n "$f"; done
      - name: Icon packer and its fixture (tools/icons)
        run: python3 -I tools/icons/test_pack.py
      # the core tests run first and stop the build on a failure; the release build exercises R8 before any tag
      - run: ./gradlew assembleDebug assembleRelease
      - run: ./gradlew lintDebug # new errors fail; known issues are in lint-baseline.xml
      - name: e2e fixture compiles
        run: ./gradlew -Pe2e :fixture:assembleDebug

name: e2e
# The emulator suite (e2e/run.sh), one emulator per shard. Not on main: its CI stays the fast one (ci.yml).
on:
  push:
    branches-ignore: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*'] # a text-only push starts no emulators
  workflow_dispatch:
    inputs:
      only: { description: 'ONLY: regex on the section names (empty: all)', default: '' }
      shards: { description: 'how many emulators (auto: one per 300 s of measured sections, at most 18)', default: 'auto' }
# a dispatch with its own `only` is a different run from the full one on the same ref: only a newer run of the same kind cancels
concurrency: { group: "e2e-${{ github.ref }}-${{ inputs.only || 'all' }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 30 # a cache miss makes the AVD here: boot, then up to 10 min of settling
    outputs: { shards: "${{ steps.plan.outputs.shards }}" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: plan # run.sh's PLAN balances the sections by e2e/ci-times, the runners' measured seconds (a section not there counts 120)
        env: { ONLY: "${{ inputs.only }}", PLAN: "${{ inputs.shards || 'auto' }}" }
        shell: bash # -eo pipefail: a failed run.sh is not hidden by the pipe
        run: |
          mkdir -p ~/.cache/ganimede && cp e2e/ci-times ~/.cache/ganimede/e2e-times
          bash e2e/run.sh | tee /dev/stderr | jq -Rnc '[inputs]' | sed 's/^/shards=/' >> "$GITHUB_OUTPUT"
      # The AVD the suite is written on: its coordinates are a Pixel 9's (1080x2424, 420 dpi), its apps Google's. A first boot
      # keeps the CPUs busy for minutes (touches get lost, Pixel Launcher shows "isn't responding" over the screen), so it is
      # made once, left to calm down and saved as a snapshot: every shard starts from that. A cache made on main serves all
      # branches (run this workflow there by hand); change the key's number with the emulator's settings below.
      - id: avd
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { key: avd-35-playstore-pixel9-2, path: "~/.android/avd/*\n~/.android/adb*" }
      - name: KVM for the runner's user
        if: steps.avd.outputs.cache-hit != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_9
          cores: 4
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim # no -no-snapshot: the exit saves it
          disable-animations: false
          # Location and Bluetooth off in the snapshot: the suite uses neither. With location on, a GNSS stop deadlocked
          # system_server's android.fg thread and the Watchdog killed it, ~5 min into a shard (run 46107202244, preview-parity:
          # "Blocked in handler on foreground thread (android.fg) for 66s" in GnssLocationProvider.stopNavigating -> native_stop;
          # in 46105280536 and 46109393420 it died at the same ~5 min, their evidence not kept). Bluetooth's stack also aborted
          # in 46107202244 (bt_stack_manage, hci_layer on_hardware_error) without killing it. Off before the snapshot, neither
          # stack starts in a shard.
          script: |
            adb shell cmd location set-location-enabled false
            adb shell 'cmd bluetooth_manager disable || svc bluetooth disable'
            adb shell 'n=0; while [ $n -lt 120 ] && [ "$(cut -d. -f1 /proc/loadavg)" -ge 1 ]; do sleep 5; n=$((n + 1)); done; cat /proc/loadavg'
            adb shell am force-stop com.google.android.apps.nexuslauncher
  # The APKs are built once here, in parallel with plan, and every shard downloads them: a shard pays for no java, gradle or build
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0 } # build-legacy.sh needs origin/main and its merge-base with this commit
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # release too: icons checks its size. The fixture is built here and fixture_install (e2e/lib.sh) finds it done: a build beside the emulator took adb offline
      - run: ./gradlew assembleDebug assembleRelease && ./gradlew -Pe2e :fixture:assembleDebug
      # main's APK, which 20-appicon upgrades from: built here like the fixture, so a shard pays nothing for it
      - run: bash e2e/build-legacy.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: |
            Ganimede-Launcher-debug.apk
            Ganimede-Launcher-release.apk
            e2e/fixture/build/outputs/apk/debug/fixture-debug.apk
            e2e/legacy/ganimede-main.apk
          if-no-files-found: error
          retention-days: 1
  shard:
    needs: [plan, build]
    runs-on: ubuntu-26.04 # ImageMagick 7 (magick), as the scripts are written for
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: { only: "${{ fromJSON(needs.plan.outputs.shards) }}" }
    name: "${{ matrix.only }}"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick && magick -version | grep 'ImageMagick 7'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: apks }
      # run.sh refuses an APK older than the sources, and the zip keeps the build job's times, which precede this checkout
      - run: touch Ganimede-Launcher-*.apk e2e/fixture/build/outputs/apk/debug/fixture-debug.apk
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: mkdir -p e2e/out/emulator-5554
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { key: avd-35-playstore-pixel9-2, path: "~/.android/avd/*\n~/.android/adb*", fail-on-cache-miss: true }
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env: { ONLY: "${{ matrix.only }}" }
        with: # plan's emulator, started from its snapshot, which is never saved again
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_9
          cores: 4
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false # run.sh sets them, and puts them back
          # vmstat: the runner's load and CPU steal through the run (UTC times), beside the clock on the fail-N screenshots
          script: |
            adb shell cat /proc/loadavg
            # the snapshot has both off (plan job): a "true" or a 1 here is a snapshot made before that, whose system server may die mid-shard
            echo "location=$(adb shell cmd location is-location-enabled | tr -d '\r') bluetooth_on=$(adb shell settings get global bluetooth_on | tr -d '\r')"
            bash -c 'vmstat -t -w 10 > e2e/out/emulator-5554/vmstat.log 2>&1 &'
            bash -o pipefail -c 'bash e2e/run.sh emulator-5554 2>&1 | tee e2e/out/emulator-5554/run.log'
      - if: always()
        run: cp ~/.cache/ganimede/e2e-times e2e/out/emulator-5554/times || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "e2e-shard-${{ strategy.job-index }}", path: e2e/out/emulator-5554/ }
  result:
    needs: shard
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'e2e-shard-*' } # not the apks artifact
      - name: Sum of the shards' Result lines
        env: { SHARDS: "${{ needs.shard.result }}" }
        run: |
          {
            echo '```'
            for d in e2e-shard-*; do echo "== $d"; grep -hE '^  FAIL|^  SKIP|^  \[.* s\]$|^ABORTED|^Result:' "$d/run.log" || echo "no run.log lines"; done
            echo; cat e2e-shard-*/run.log | awk '/^Result: [0-9]+ passed, [0-9]+ failed/ { p += $2; f += $4; n++ } END { print "Result: " p+0 " passed, " f+0 " failed. " n+0 " shard(s) reached their Result line" }'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$SHARDS" = success ] # red when a shard failed or stopped before its Result line

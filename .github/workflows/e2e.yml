name: e2e
# The emulator suite (e2e/run.sh), one emulator per shard. Not on main: its CI stays the fast one (ci.yml).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      only: { description: 'ONLY: regex on the section names (empty: all)', default: '' }
      shards: { description: 'how many emulators', default: '4' }
concurrency: { group: "e2e-${{ github.ref }}", cancel-in-progress: true }
jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs: { shards: "${{ steps.plan.outputs.shards }}" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: plan # run.sh's PLAN balances the sections by e2e/ci-times, the runners' measured seconds (a section not there counts 120)
        env: { ONLY: "${{ inputs.only }}", PLAN: "${{ inputs.shards || 4 }}" }
        run: |
          mkdir -p ~/.cache/ganimede && cp e2e/ci-times ~/.cache/ganimede/e2e-times
          bash e2e/run.sh | tee /dev/stderr | jq -Rnc '[inputs]' | sed 's/^/shards=/' >> "$GITHUB_OUTPUT"
  shard:
    needs: plan
    runs-on: ubuntu-26.04 # ImageMagick 7 (magick), as the scripts are written for
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { only: "${{ fromJSON(needs.plan.outputs.shards) }}" }
    name: "${{ matrix.only }}"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick && magick -version | grep 'ImageMagick 7'
      - run: ./gradlew assembleDebug # after the checkout: run.sh refuses an APK older than the sources
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: mkdir -p e2e/out/emulator-5554
      # the AVD the suite is written on: its coordinates are a Pixel 9's (1080x2424, 420 dpi), its apps Google's
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env: { ONLY: "${{ matrix.only }}" }
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_9
          cores: 4
          ram-size: 3072M
          disable-animations: false # run.sh sets them, and puts them back
          script: bash -o pipefail -c 'bash e2e/run.sh emulator-5554 2>&1 | tee e2e/out/emulator-5554/run.log'
      - if: always()
        run: cp ~/.cache/ganimede/e2e-times e2e/out/emulator-5554/times || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "e2e-shard-${{ strategy.job-index }}", path: e2e/out/emulator-5554/ }
  result:
    needs: shard
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Sum of the shards' Result lines
        env: { SHARDS: "${{ needs.shard.result }}" }
        run: |
          {
            echo '```'
            for d in e2e-shard-*; do echo "== $d"; grep -hE '^  FAIL|^  SKIP|^  \[.* s\]$|^ABORTED|^Result:' "$d/run.log" || echo "no run.log lines"; done
            echo; cat e2e-shard-*/run.log | awk '/^Result: [0-9]+ passed, [0-9]+ failed/ { p += $2; f += $4; n++ } END { print "Result: " p+0 " passed, " f+0 " failed. " n+0 " shard(s) reached their Result line" }'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$SHARDS" = success ] # red when a shard failed or stopped before its Result line
